table:
  name: bootstrap_staker_assets
  schema: public

object_relationships:
  - name: token
    using:
      foreign_key_constraint_on: asset_id

array_relationships:
  - name: delegation_states
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: bootstrap_delegation_states
        column_mapping:
          staker_id: staker_id
          asset_id: asset_id

select_permissions:
  - permission:
      columns:
        - staker_id
        - asset_id
        - deposited
        - withdrawable
        - delegated
        - updated_at
        - updated_at_block
      filter: { }
      limit: 1000
    role: anonymous
