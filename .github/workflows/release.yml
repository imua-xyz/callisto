name: Release

on:
  merge_group:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - develop
      - main
      - master
      - chains/imuachain

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main

      - name: Set up .release-env
        if: github.event_name != 'pull_request'
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" > .release-env

      - name: Run GoReleaser (dry run for PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker run \
            --rm \
            --privileged \
            -e CGO_ENABLED=1 \
            -e CGO_CFLAGS=-std=gnu11 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/go/src/github.com/imua-xyz/callisto \
            -v $HOME/go/pkg:/go/pkg \
            -w /go/src/github.com/imua-xyz/callisto \
            ghcr.io/goreleaser/goreleaser-cross:v1.22-v2.0.0 \
            release --clean --skip validate,publish --snapshot

      - name: Run GoReleaser (real release on tag)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run \
            --rm \
            --privileged \
            -e CGO_ENABLED=1 \
            -e CGO_CFLAGS=-std=gnu11 \
            --env-file .release-env \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/go/src/github.com/imua-xyz/callisto \
            -w /go/src/github.com/imua-xyz/callisto \
            ghcr.io/goreleaser/goreleaser-cross:v1.22-v2.0.0 \
            release --clean --skip validate

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/imua-xyz/callisto:latest
          ghcr.io/imua-xyz/callisto:${{ github.ref_name//\//- }}

    - name: Log in to Docker Hub (or GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/imua-xyz/callisto:latest
          ghcr.io/imua-xyz/callisto:${{ github.ref_name//\//- }}